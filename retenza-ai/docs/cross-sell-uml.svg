<?xml version="1.0" encoding="UTF-8"?>
<!--
  Diagramme de séquence — Module Cross-Sell / Up-Sell
  Retenza AI — Architecture simplifiée
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Fond -->
  <rect width="860" height="560" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Titre -->
  <rect x="0" y="0" width="860" height="52" rx="16" fill="#4f46e5"/>
  <rect x="0" y="36" width="860" height="16" fill="#4f46e5"/>
  <text x="430" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="white">
    Cross-Sell / Up-Sell — Diagramme de séquence simplifié
  </text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">
    Retenza AI · Market Basket Analysis · Post-Caisse Hook
  </text>

  <!-- ─── Acteurs (en-têtes) ─────────────────────────────────────────────── -->
  <!-- Caisse / API partenaire -->
  <rect x="30" y="70" width="110" height="36" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="85" y="91" text-anchor="middle" font-size="11" font-weight="700" fill="#4338ca">🏪 Caisse</text>
  <text x="85" y="101" text-anchor="middle" font-size="9" fill="#6366f1">/ API partenaire</text>

  <!-- addCommande (rfmController) -->
  <rect x="185" y="70" width="120" height="36" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="245" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">⚡ addCommande</text>
  <text x="245" y="100" text-anchor="middle" font-size="9" fill="#b45309">rfmController.js</text>

  <!-- crossSellController -->
  <rect x="355" y="70" width="130" height="36" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="420" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">🛒 CrossSell</text>
  <text x="420" y="100" text-anchor="middle" font-size="9" fill="#059669">crossSellController.js</text>

  <!-- MongoDB -->
  <rect x="535" y="70" width="120" height="36" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="595" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#581c87">🗄️ MongoDB</text>
  <text x="595" y="100" text-anchor="middle" font-size="9" fill="#7c3aed">ProductAssociations</text>

  <!-- pushService / emailService -->
  <rect x="700" y="70" width="130" height="36" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="765" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#881337">📱 Push / Email</text>
  <text x="765" y="100" text-anchor="middle" font-size="9" fill="#e11d48">pushService.js</text>

  <!-- ─── Lignes de vie ─────────────────────────────────────────────────── -->
  <line x1="85"  y1="106" x2="85"  y2="520" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="245" y1="106" x2="245" y2="520" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="420" y1="106" x2="420" y2="520" stroke="#10b981" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="595" y1="106" x2="595" y2="520" stroke="#a855f7" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="765" y1="106" x2="765" y2="520" stroke="#f43f5e" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ─── Messages de séquence ───────────────────────────────────────────── -->

  <!-- 1. POST /api/commandes/add -->
  <line x1="90" y1="140" x2="238" y2="140" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="100" y="124" width="130" height="14" rx="3" fill="#f8fafc"/>
  <text x="165" y="134" text-anchor="middle" font-size="10" fill="#4338ca" font-weight="600">POST /api/commandes/add</text>

  <!-- 2. insertOne(commande) -->
  <line x1="250" y1="168" x2="248" y2="185" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="258" y="156" width="160" height="28" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="338" y="168" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600">db.commandes.insertOne()</text>
  <text x="338" y="179" text-anchor="middle" font-size="9" fill="#b45309">+ clearStatsCache()</text>

  <!-- 3. Réponse immédiate 200 OK -->
  <line x1="240" y1="200" x2="92"  y2="200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-gray)"/>
  <rect x="105" y="185" width="130" height="14" rx="3" fill="#f8fafc"/>
  <text x="170" y="196" text-anchor="middle" font-size="10" fill="#64748b">200 OK (non-bloquant)</text>

  <!-- 4. setImmediate → triggerCrossSellPush -->
  <line x1="250" y1="225" x2="413" y2="225" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="255" y="208" width="155" height="16" rx="3" fill="#f0fdf4"/>
  <text x="332" y="219" text-anchor="middle" font-size="10" fill="#065f46" font-weight="600">setImmediate → triggerCrossSellPush</text>

  <!-- 5. Anti-spam check -->
  <line x1="425" y1="252" x2="588" y2="252" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="425" y="238" width="160" height="13" rx="3" fill="#fdf4ff"/>
  <text x="505" y="248" text-anchor="middle" font-size="10" fill="#581c87">cross_sell_pushes.findOne()</text>

  <!-- 5b. Réponse anti-spam -->
  <line x1="590" y1="268" x2="428" y2="268" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
  <text x="510" y="264" text-anchor="middle" font-size="9" fill="#64748b">null → pas de push récent</text>

  <!-- 6. Requête ProductAssociations -->
  <line x1="425" y1="295" x2="588" y2="295" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="428" y="281" width="158" height="13" rx="3" fill="#fdf4ff"/>
  <text x="507" y="291" text-anchor="middle" font-size="10" fill="#581c87">ProductAssociations.find(produitA)</text>

  <!-- 6b. Règles retournées -->
  <line x1="590" y1="311" x2="428" y2="311" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
  <text x="510" y="307" text-anchor="middle" font-size="9" fill="#64748b">règles triées par confiance × lift</text>

  <!-- 7. sendCrossSellPush -->
  <line x1="425" y1="338" x2="758" y2="338" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="453" y="323" width="155" height="13" rx="3" fill="#fff1f2"/>
  <text x="530" y="333" text-anchor="middle" font-size="10" fill="#881337" font-weight="600">sendCrossSellPush() [FCM simulé]</text>

  <!-- 7b. Réponse push -->
  <line x1="760" y1="353" x2="428" y2="353" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
  <text x="595" y="349" text-anchor="middle" font-size="9" fill="#64748b">{ status: 'simulated' }</text>

  <!-- 8. sendEmail suggestion -->
  <line x1="425" y1="378" x2="758" y2="378" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="453" y="364" width="155" height="13" rx="3" fill="#fff1f2"/>
  <text x="530" y="374" text-anchor="middle" font-size="10" fill="#881337">sendEmail() [suggestion produit B]</text>

  <!-- 9. Enregistrement anti-spam -->
  <line x1="425" y1="403" x2="588" y2="403" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="428" y="389" width="158" height="13" rx="3" fill="#fdf4ff"/>
  <text x="507" y="399" text-anchor="middle" font-size="10" fill="#581c87">cross_sell_pushes.insertOne()</text>

  <!-- ─── Scheduler 6h (note latérale) ─────────────────────────────────── -->
  <rect x="30" y="440" width="800" height="62" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="44" y="460" font-size="11" font-weight="700" fill="#92400e">⏰ Scheduler automatique (toutes les 6h) :</text>
  <text x="44" y="476" font-size="10" fill="#b45309">  server.js → tickScheduler() → crossSellTickCounter ≥ 72 ticks → runAssociationAnalysis(commerceId, db)</text>
  <text x="44" y="491" font-size="10" fill="#b45309">  → Recalcul du support / confiance / lift → Upsert dans ProductAssociations · Enregistré dans job_runs</text>

  <!-- ─── Légende ────────────────────────────────────────────────────────── -->
  <text x="430" y="530" text-anchor="middle" font-size="9" fill="#94a3b8">
    → Appel synchrone  ··· Réponse  — — Async / fire-and-forget
  </text>
</svg>
